[workspace]

[package]
name = "lumen-live"
version = "0.1.0"
description = "Lumen MD Live — Typora-class WYSIWYG Markdown editor"
authors = ["Lumen MD"]
edition = "2021"
rust-version = "1.78"

[lib]
name = "lumen_live_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
parking_lot = "0.12"
thiserror = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
