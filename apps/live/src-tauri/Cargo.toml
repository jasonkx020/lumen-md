[workspace]

[package]
name = "lumen-live"
version = "0.1.0"
description = "Lumen MD Live — Typora-class WYSIWYG Markdown editor"
authors = ["Lumen MD"]
edition = "2021"
rust-version = "1.78"

[lib]
name = "lumen_live_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
parking_lot = "0.12"
thiserror = "1"
directories = "5"
keyring = { version = "3", features = ["windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# MD→DOCX：BSD-2-Clause + MIT，可商用；不引入 Pandoc / GPL
comrak = { version = "0.49", default-features = false }
docx-rs = "0.4"
# HTML 消毒 / 表解析（导出 HTML table 含 rowspan）
ammonia = "4"
scraper = "0.22"

[dev-dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
